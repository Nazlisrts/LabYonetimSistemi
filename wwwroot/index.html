<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LRP - Giriş</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center" style="min-height:100vh">
        <div class="card p-4 shadow" style="width:360px">
            <h4 class="text-center mb-3">LRP Sistemi</h4>
            <div id="errorMsg" class="alert alert-danger d-none"></div>
            <input type="text" id="username" class="form-control mb-2" placeholder="Kullanıcı Adı">
            <input type="password" id="password" class="form-control mb-3" placeholder="Şifre">
            <button class="btn btn-primary w-100" onclick="login()">Giriş Yap</button>
        </div>
    </div>
    <script>
        async function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const res = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            if (!res.ok) {
                const err = document.getElementById("errorMsg");
                err.textContent = "Hatalı kullanıcı adı veya şifre!";
                err.classList.remove("d-none");
                return;
            }
            const user = await res.json();
            localStorage.setItem("lrp_user", JSON.stringify(user));
            window.location.href = user.role === "Admin" ? "/admin.html" : "/student.html";
        }
    </script>
</body>
</html>
