<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LRP - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #4e73df;
            color: white;
        }

        .nav-link {
            color: rgba(255,255,255,.8);
            cursor: pointer;
        }

            .nav-link:hover {
                color: white;
            }

        .card {
            border: none;
            box-shadow: 0 0.15rem 1.75rem rgba(58,59,69,.15);
        }

        .section {
            display: none;
        }

            .section.active {
                display: block;
            }
    </style>
</head>
<body>
    <script src="/js/auth.js"></script>
    <script>const currentUser = requireRole("Admin");</script>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 sidebar p-3">
                <h5 class="text-center mb-4"><i class="fas fa-flask me-2"></i>LRP Admin</h5>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" onclick="showSection('labs')"><i class="fas fa-door-open me-2"></i>Laboratuvarlar</a></li>
                    <li class="nav-item"><a class="nav-link" onclick="showSection('computers')"><i class="fas fa-laptop me-2"></i>Bilgisayarlar</a></li>
                    <li class="nav-item"><a class="nav-link" onclick="showSection('assign')"><i class="fas fa-user-tag me-2"></i>Zimmet Ata</a></li>
                    <li class="nav-item mt-4"><a class="nav-link text-warning" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Çıkış</a></li>
                </ul>
            </nav>

            <main class="col-md-10 p-4">

                <!-- LABS SECTION -->
                <div id="section-labs" class="section">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4>Laboratuvarlar</h4>
                        <button class="btn btn-primary btn-sm" onclick="showModal('labModal')">+ Yeni Lab</button>
                    </div>
                    <div class="card p-3">
                        <table class="table table-hover">
                            <thead><tr><th>ID</th><th>Ad</th><th>PC Sayısı</th><th>İşlem</th></tr></thead>
                            <tbody id="labTable"></tbody>
                        </table>
                    </div>
                </div>

                <!-- COMPUTERS SECTION -->
                <div id="section-computers" class="section">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4>Bilgisayarlar</h4>
                        <button class="btn btn-primary btn-sm" onclick="showModal('pcModal')">+ Yeni PC</button>
                    </div>
                    <div class="card p-3">
                        <table class="table table-hover">
                            <thead><tr><th>Kod</th><th>Marka</th><th>İşlemci</th><th>RAM</th><th>HDMI</th><th>Veyon</th><th>İşlem</th></tr></thead>
                            <tbody id="pcTable"></tbody>
                        </table>
                    </div>
                </div>

                <!-- ASSIGN SECTION -->
                <div id="section-assign" class="section">
                    <h4 class="mb-3">Öğrenci Zimmet Atama</h4>
                    <div class="card p-4" style="max-width:500px">
                        <input type="text" id="aFullName" class="form-control mb-2" placeholder="Ad Soyad">
                        <input type="text" id="aStudentNo" class="form-control mb-2" placeholder="Öğrenci No">
                        <input type="number" id="aGrade" class="form-control mb-2" placeholder="Sınıf (1 veya 2)">
                        <select id="aPcId" class="form-select mb-3"></select>
                        <button class="btn btn-success w-100" onclick="assignStudent()">Zimmet Ata & Hesap Oluştur</button>
                    </div>
                    <div class="card p-3 mt-4">
                        <table class="table">
                            <thead><tr><th>Ad Soyad</th><th>Öğrenci No</th><th>PC ID</th></tr></thead>
                            <tbody id="studentTable"></tbody>
                        </table>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- LAB MODAL -->
    <div class="modal fade" id="labModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Lab Ekle / Güncelle</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="labId">
                    <input type="text" id="labName" class="form-control" placeholder="Lab Adı (Örn: Lab-A)">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Kapat</button>
                    <button class="btn btn-primary" onclick="saveLab()">Kaydet</button>
                </div>
            </div>
        </div>
    </div>

    <!-- PC MODAL -->
    <div class="modal fade" id="pcModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">PC Ekle / Güncelle</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="pcId">
                    <select id="pcLabId" class="form-select mb-2"></select>
                    <input type="text" id="pcBrand" class="form-control mb-2" placeholder="Marka">
                    <input type="text" id="pcProcessor" class="form-control mb-2" placeholder="İşlemci">
                    <input type="number" id="pcRam" class="form-control mb-2" placeholder="RAM (GB)">
                    <div class="form-check"><input class="form-check-input" type="checkbox" id="pcHdmi"><label class="form-check-label">HDMI</label></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" id="pcInternet"><label class="form-check-label">İnternet</label></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" id="pcVeyon"><label class="form-check-label">Veyon</label></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Kapat</button>
                    <button class="btn btn-primary" onclick="savePc()">Kaydet</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
