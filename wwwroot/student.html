<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LRP - Öğrenci Portalı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #4e73df;
            color: white;
        }

        .nav-link {
            color: rgba(255,255,255,.8);
        }

        .card {
            border: none;
            box-shadow: 0 0.15rem 1.75rem rgba(58,59,69,.15);
        }
    </style>
</head>
<body>
    <script src="/js/auth.js"></script>
    <script>const currentUser = requireRole("Student");</script>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 sidebar p-3">
                <h5 class="text-center mb-4"><i class="fas fa-user-graduate me-2"></i>Öğrenci</h5>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link active"><i class="fas fa-laptop me-2"></i>Zimmetli PC</a></li>
                    <li class="nav-item mt-4"><a class="nav-link text-warning" style="cursor:pointer" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Çıkış</a></li>
                </ul>
            </nav>
            <main class="col-md-10 p-4">
                <h4>Merhaba, <span id="welcomeName"></span></h4>
                <div class="card p-4 mt-3" id="pcCard">
                    <p class="text-muted">Yükleniyor...</p>
                </div>
            </main>
        </div>
    </div>

    <script>
function logout() {
    localStorage.removeItem("lrp_user");
    window.location.href = "/";
}

async function loadMyPc() {
    document.getElementById("welcomeName").textContent = currentUser.username;
    const res = await fetch(`/api/student/my-pc/${currentUser.username}`);
    if (!res.ok) {
        document.getElementById("pcCard").innerHTML = "<p class='text-danger'>Zimmetli bilgisayar bulunamadı.</p>";
        return;
    }
    const pc = await res.json();
    document.getElementById("pcCard").innerHTML = `
        <h5><i class="fas fa-laptop me-2"></i>${pc.brand}</h5>
        <hr>
        <p><strong>Demirbaş Kodu:</strong> ${pc.assetCode}</p>
        <p><strong>İşlemci:</strong> ${pc.processor}</p>
        <p><strong>RAM:</strong> ${pc.ram} GB</p>
        <p><strong>HDMI:</strong> ${pc.hasHdmi ? "✅ Var" : "❌ Yok"}</p>
        <p><strong>İnternet:</strong> ${pc.hasInternet ? "✅ Var" : "❌ Yok"}</p>
        <p><strong>Veyon:</strong> ${pc.hasVeyon ? "✅ Var" : "❌ Yok"}</p>`;
}

loadMyPc();
    </script>
</body>
</html>
